[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipnotes"
version = "0.1.0"
description = "Generate readable release notes from Git history and Conventional Commits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shipnotes contributors" }]
keywords = ["changelog", "release-notes", "git", "conventional-commits"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.scripts]
shipnotes = "shipnotes.cli:main"

[tool.setuptools]
packages = ["shipnotes"]
